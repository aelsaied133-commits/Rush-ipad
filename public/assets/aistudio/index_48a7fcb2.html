<script>
const $=s=>document.querySelector(s),cv=$('#c');let ctx=cv.getContext('2d'),EXP=0;
const PAL=['#ef4444','#22c55e','#3b82f6','#f59e0b','#a855f7','#06b6d4'],NEED={V:3,W:4,X:4};
const HINT={pan:'اسحب لتحريك الشاشة • اقرص للتكبير',move:'المس قطعة ثم اسحبها • اسحب نقاط الزوايا لتعديلها',rot:'اسحب لتدوير القطعة المحددة حول نقطة الدوران',pivot:'المس لتحديد نقطة الدوران للقطعة المحددة',cut:'ارسم حول المنطقة بإصبعك لقصها',poly:'المس لتحديد رؤوس الشكل بخطوط مستقيمة، ثم المس أول نقطة أو ✔ لإتمام القص',V:'3 نقاط: الأولى ثم الرأس ثم الثالثة',W:'4 نقاط متتالية، تُقاس الزاويتان عند الداخليتين',X:'خطان: نقطتان لكل خط، وتُقاس الزاوية بينهما'};
let W=0,H=0,dpr=1,V={s:1,x:0,y:0},layers=[],angles=[],mode='pan',selL=null,selA=null,pend=[],cutPath=null,undo=[],drag=null,pinch=null,q=0;
const ptrs=new Map();
const R=()=>{if(!q){q=1;requestAnimationFrame(()=>{q=0;draw()})}};
const APX={V:[1],W:[1,2],X:[]};
const wp=a=>a.pts.map(p=>{if(!p.L)return{x:p.x,y:p.y};const w=l2w(p.L,p.u,p.v);return{x:w[0],y:w[1]}});
const anch=(x,y)=>{const L=hit(x,y);if(L){const w=w2l(L,x,y);return{L,u:w[0],v:w[1]}}return{x,y}};
function pip(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
const w2s=(x,y)=>[x*V.s+V.x,y*V.s+V.y],s2w=(x,y)=>[(x-V.x)/V.s,(y-V.y)/V.s];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true});return c};
function resize(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;R()}
addEventListener('resize',resize);
function l2w(L,u,v){const c=Math.cos(L.r),s=Math.sin(L.r),dx=L.x+u-L.px,dy=L.y+v-L.py;return[L.px+dx*c-dy*s,L.py+dx*s+dy*c]}
function w2l(L,X,Y){const c=Math.cos(-L.r),s=Math.sin(-L.r),dx=X-L.px,dy=Y-L.py;return[L.px+dx*c-dy*s-L.x,L.py+dx*s+dy*c-L.y]}
function hit(X,Y){for(let i=layers.length-1;i>=0;i--){const L=layers[i],[u,v]=w2l(L,X,Y);if(u>=0&&v>=0&&u<L.cv.width&&v<L.cv.height){if(L.cv.getContext('2d').getImageData(u|0,v|0,1,1).data[3]>10)return L}}return null}
function setPivot(L,wx,wy){const dx=wx-L.px,dy=wy-L.py,c=Math.cos(L.r),s=Math.sin(L.r);L.x+=dx-(dx*c+dy*s);L.y+=dy-(-dx*s+dy*c);L.px=wx;L.py=wy}
function fit(){if(!layers.length)return;let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const L of layers)for(const[u,v]of[[0,0],[L.cv.width,0],[0,L.cv.height],[L.cv.width,L.cv.height]]){const p=l2w(L,u,v);a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}
V.s=Math.min(W/(c-a),H/(d-b))*.92;V.x=W/2-(a+c)/2*V.s;V.y=H/2-(b+d)/2*V.s;R()}
async function addFiles(fs){for(const f of fs){try{const b=await createImageBitmap(f);const k=Math.min(1,4096/Math.max(b.width,b.height)),w=Math.round(b.width*k),h=Math.round(b.height*k),c=mk(w,h);c.getContext('2d').drawImage(b,0,0,w,h);
const off=layers.length?Math.max(...layers.map(l=>l.x+l.cv.width))+40:0,L={cv:c,x:off,y:0,r:0,px:off+w/2,py:h/2,f:{b:100,c:100,g:0,i:0}};layers.push(L);selL=L;if(layers.length==1)fit()}catch(e){alert('تعذر فتح هذه الصورة: '+f.name)}}sync();R()}
function calc(a){const p=wp(a),it=[];let ln=[],ex=[];
const dg=(c,u,w)=>{const a1=Math.atan2(u.y-c.y,u.x-c.x),a2=Math.atan2(w.y-c.y,w.x-c.x),d=Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1));return{v:c,a1,d,val:Math.abs(d)*180/Math.PI}};
if(a.t=='V'){it.push(dg(p[1],p[0],p[2]));ln=[[0,1],[1,2]]}
else if(a.t=='W'){it.push(dg(p[1],p[0],p[2]),dg(p[2],p[1],p[3]));ln=[[0,1],[1,2],[2,3]]}
else{ln=[[0,1],[2,3]];const d1={x:p[1].x-p[0].x,y:p[1].y-p[0].y},d2={x:p[3].x-p[2].x,y:p[3].y-p[2].y},den=d1.x*d2.y-d1.y*d2.x;
if(Math.abs(den)>1e-9){const t=((p[2].x-p[0].x)*d2.y-(p[2].y-p[0].y)*d2.x)/den,i={x:p[0].x+t*d1.x,y:p[0].y+t*d1.y};ex=[[1,i],[3,i]];
const a1=Math.atan2(d1.y,d1.x),a2=Math.atan2(d2.y,d2.x),d=Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1));it.push({v:i,a1,d,val:Math.abs(d)*180/Math.PI,x:1})}}
return{it,ln,ex}}
const vals=a=>calc(a).it.map(t=>t.x?t.val.toFixed(1)+'° / '+(180-t.val).toFixed(1)+'°':t.val.toFixed(1)+'°').join(' ، ')||'—';
function drawA(a,k){const c=PAL[k%PAL.length],g=calc(a),S=wp(a).map(p=>w2s(p.x,p.y));ctx.lineWidth=2.5;ctx.strokeStyle=c;
ctx.setLineDash([6,5]);ctx.globalAlpha=.6;for(const[i,t]of g.ex){const e=w2s(t.x,t.y);ctx.beginPath();ctx.moveTo(S[i][0],S[i][1]);ctx.lineTo(e[0],e[1]);ctx.stroke()}
ctx.setLineDash([]);ctx.globalAlpha=1;
for(const[i,j]of g.ln){ctx.beginPath();ctx.moveTo(S[i][0],S[i][1]);ctx.lineTo(S[j][0],S[j][1]);ctx.stroke()}
for(const t of g.it){const v=w2s(t.v.x,t.v.y);ctx.beginPath();ctx.arc(v[0],v[1],26,t.a1,t.a1+t.d,t.d<0);ctx.stroke();
const m=t.a1+t.d/2,tx=v[0]+Math.cos(m)*50,ty=v[1]+Math.sin(m)*50,s=t.x?t.val.toFixed(1)+'° / '+(180-t.val).toFixed(1)+'°':t.val.toFixed(1)+'°';
ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(s,tx,ty);ctx.fillStyle='#fff';ctx.fillText(s,tx,ty);ctx.lineWidth=2.5;ctx.strokeStyle=c}
S.forEach((s,i)=>{const ap=(APX[a.t]||[]).includes(i);ctx.beginPath();ctx.arc(s[0],s[1],ap?11:(a===selA?10:7),0,7);ctx.fillStyle=ap?c:'#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=ap?'#fff':c;ctx.stroke()});
if(a.t=='X'&&g.it[0]){const v=w2s(g.it[0].v.x,g.it[0].v.y);ctx.beginPath();ctx.arc(v[0],v[1],11,0,7);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);$('#bClose').style.display=(mode=='poly'&&cutPath&&cutPath.length>=3)?'':'none';
if(!layers.length){ctx.fillStyle=getComputedStyle(document.body).color;ctx.globalAlpha=.6;ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('اضغط 📂 لرفع صورة',W/2,H/2);ctx.globalAlpha=1}
for(const L of layers){ctx.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.x,dpr*V.y);ctx.translate(L.px,L.py);ctx.rotate(L.r);ctx.translate(-L.px,-L.py);
ctx.filter=`brightness(${L.f.b}%) contrast(${L.f.c}%) grayscale(${L.f.g?1:0}) invert(${L.f.i?1:0})`;ctx.drawImage(L.cv,L.x,L.y);ctx.filter='none';
if(L===selL&&!EXP){ctx.lineWidth=2/V.s;ctx.strokeStyle='#f59e0b';ctx.setLineDash([6/V.s,4/V.s]);ctx.strokeRect(L.x,L.y,L.cv.width,L.cv.height);ctx.setLineDash([])}}
ctx.setTransform(dpr,0,0,dpr,0,0);
if(selL&&!EXP){const p=w2s(selL.px,selL.py);ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],9,0,7);ctx.moveTo(p[0]-15,p[1]);ctx.lineTo(p[0]+15,p[1]);ctx.moveTo(p[0],p[1]-15);ctx.lineTo(p[0],p[1]+15);ctx.stroke()}
if(!EXP||$('#exA').checked)angles.forEach(drawA);
if(pend.length&&!EXP){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();pend.forEach((p,i)=>{const s=w2s(p.x,p.y);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.stroke();pend.forEach(p=>{const s=w2s(p.x,p.y);ctx.beginPath();ctx.arc(s[0],s[1],6,0,7);ctx.fillStyle='#f59e0b';ctx.fill()})}
if(cutPath&&!EXP){ctx.strokeStyle='#facc15';ctx.lineWidth=2.5;ctx.setLineDash([7,5]);ctx.beginPath();cutPath.forEach((p,i)=>{const s=w2s(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.stroke();ctx.setLineDash([]);if(mode=='poly')cutPath.forEach((p,i)=>{const s=w2s(p[0],p[1]);ctx.beginPath();ctx.arc(s[0],s[1],i?5:10,0,7);ctx.fillStyle=i?'#facc15':'#f59e0b';ctx.fill()})}}
function hHit(x,y){for(let k=angles.length-1;k>=0;k--){const a=angles[k],P=wp(a);
if(a.t=='X'){const g=calc(a);if(g.it[0]){const s=w2s(g.it[0].v.x,g.it[0].v.y);if(Math.hypot(s[0]-x,s[1]-y)<22)return{a,i:-1,ap:1}}}
for(let i=P.length-1;i>=0;i--){const s=w2s(P[i].x,P[i].y);if(Math.hypot(s[0]-x,s[1]-y)<20)return{a,i,ap:(APX[a.t]||[]).includes(i)?1:0}}}return null}
function finishCut(){const P=cutPath;cutPath=null;if(!P||P.length<3)return;const T=hit(P[0][0],P[0][1])||selL||layers[layers.length-1];if(!T)return;
const lp=P.map(p=>w2l(T,p[0],p[1])),us=lp.map(p=>p[0]),vs=lp.map(p=>p[1]);
const u0=Math.max(0,Math.floor(Math.min(...us))),v0=Math.max(0,Math.floor(Math.min(...vs))),u1=Math.min(T.cv.width,Math.ceil(Math.max(...us))),v1=Math.min(T.cv.height,Math.ceil(Math.max(...vs))),bw=u1-u0,bh=v1-v0;if(bw<3||bh<3)return;
const nc=mk(bw,bh),n=nc.getContext('2d');n.beginPath();lp.forEach((p,i)=>n[i?'lineTo':'moveTo'](p[0]-u0,p[1]-v0));n.closePath();n.clip();n.drawImage(T.cv,-u0,-v0);
let bk=null;const t=T.cv.getContext('2d');
if($('#cm').value=='cut'){bk=mk(T.cv.width,T.cv.height);bk.getContext('2d').drawImage(T.cv,0,0);t.save();t.globalCompositeOperation='destination-out';t.beginPath();lp.forEach((p,i)=>t[i?'lineTo':'moveTo'](p[0],p[1]));t.closePath();t.fill();t.restore()}
const N={cv:nc,x:T.x+u0,y:T.y+v0,r:T.r,px:T.px,py:T.py,f:{...T.f}};const c=l2w(N,bw/2,bh/2);setPivot(N,c[0],c[1]);layers.push(N);selL=N;const mvd=[];if(bk)for(const a of angles)for(const p of a.pts)if(p.L===T&&pip(lp,p.u,p.v)){mvd.push([p,p.u,p.v]);p.L=N;p.u-=u0;p.v-=v0}
undo.push(()=>{layers.splice(layers.indexOf(N),1);if(bk){t.clearRect(0,0,T.cv.width,T.cv.height);t.drawImage(bk,0,0)}selL=T;for(const[p,u,v]of mvd){p.L=T;p.u=u;p.v=v}});setMode('move');sync()}
function down(x,y){const[wx,wy]=s2w(x,y);if(selL&&(mode=='rot'||mode=='pivot')){const p=w2s(selL.px,selL.py);if(Math.hypot(p[0]-x,p[1]-y)<24){drag={t:'pv',L:selL,o:{x:selL.x,y:selL.y,px:selL.px,py:selL.py}};return}}
if(!['cut','poly','rot','pivot'].includes(mode)&&!pend.length){const h=hHit(x,y);if(h){selA=h.a;selL=null;drag={t:h.ap?'ha':'h',a:h.a,i:h.i,o:h.a.pts.map(p=>({...p})),P:wp(h.a),wx,wy};R();return}}
if(mode=='pan'){drag={t:'pan',x,y,vx:V.x,vy:V.y}}
else if(mode=='move'){const L=hit(wx,wy);if(L){selL=L;selA=null;sync();drag={t:'mv',L,wx,wy,o:{x:L.x,y:L.y,px:L.px,py:L.py}}}else drag={t:'pan',x,y,vx:V.x,vy:V.y}}
else if(mode=='rot'){const L=selL||hit(wx,wy);if(L){selL=L;drag={t:'rt',L,a0:Math.atan2(wy-L.py,wx-L.px),r0:L.r}}}
else if(mode=='pivot'){const L=selL||hit(wx,wy);if(L){selL=L;const o={x:L.x,y:L.y,px:L.px,py:L.py};setPivot(L,wx,wy);undo.push(()=>Object.assign(L,o))}}
else if(mode=='cut'){cutPath=[[wx,wy]];drag={t:'cut'}}
else if(mode=='poly'){if(!cutPath)cutPath=[[wx,wy]];else{const f=w2s(cutPath[0][0],cutPath[0][1]);if(cutPath.length>=3&&Math.hypot(f[0]-x,f[1]-y)<24)finishCut();else cutPath.push([wx,wy])}}
else if(NEED[mode]){pend.push({x:wx,y:wy});$('#hint').textContent=HINT[mode]+' ('+pend.length+'/'+NEED[mode]+')';if(pend.length==NEED[mode]){const a={t:mode,pts:pend.map(p=>anch(p.x,p.y))};angles.push(a);selA=a;selL=null;undo.push(()=>{angles.splice(angles.indexOf(a),1);selA=null});list();setMode('move')}}
R()}
function move(x,y){if(!drag)return;const[wx,wy]=s2w(x,y);
